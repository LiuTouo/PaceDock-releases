      <stop offset="1" stop-color="#14141f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#262637" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1440" height="440" rx="24" fill="#11111b"/>
