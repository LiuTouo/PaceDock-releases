<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title description">
  <title id="title">PaceDock — 實測。排序。套用。還原。</title>
  <desc id="description">近黑儀器面板品牌封面。左側為 PaceDock 名稱與產品標語，右側以候選核心複測排名示意卡呈現實測、排序、套用與還原的概念。所有數據皆為示意。</desc>
